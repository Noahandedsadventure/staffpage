<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Train Log | Noah & Ed's</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header class="topbar">

<div class="brand">

<img src="logo.jpg" class="logo">

<div>

<div class="eyebrow">
NOAH & ED'S TRAIN ADVENTURES
</div>

<h1>TRAIN LOG</h1>

</div>

</div>


<a href="index.html" class="back-button">
← Staff Portal
</a>

</header>


<main>

<section class="page-hero">

<div>

<div class="online-status">
LOGGING SYSTEM
</div>

<h2>
Train
<span>Log</span>
</h2>

<p>
Record detailed train and detector information.
</p>

</div>

</section>


<section class="section">

<div class="section-header">
<span>01</span>
<h2>New Log Entry</h2>
</div>


<form class="staff-form">

<label>
Date

<input type="date">
</label>


<label>
Time

<input type="time">
</label>


<label>
Detector Location

<input
type="text"
placeholder="Example: Dundas Mile 55">
</label>


<label>
Train

<input
type="text"
placeholder="Train number">
</label>


<label>
Axle Count

<input
type="number"
placeholder="Axles">
</label>


<label>
Speed

<input
type="number"
placeholder="MPH">
</label>


<label>
Temperature

<input
type="number"
placeholder="Temperature">
</label>


<label>
Notes

<textarea
placeholder="Detector message / notes..."></textarea>
</label>


<button type="button"
onclick="alert('Train log form ready for database integration.')">
Save Log
</button>

</form>

</section>


<section class="section">

<div class="section-header">
<span>02</span>
<h2>Log Database</h2>
</div>


<div class="empty-state">

📋

<h3>
No logs loaded
</h3>

<p>
A database can be connected here later.
</p>

</div>

</section>

</main>


<footer>
© 2026 Noah & Ed's Train Adventures
</footer>

</body>

</html>
